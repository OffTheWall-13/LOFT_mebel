{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="registeration__content">
        <form method="post" class="registeration__form active">
            {% csrf_token %}
            <h2 class="registeration__title products__title">Авторизация</h2>

            {% if form.non_field_errors %}
                <div class="form-errors">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="registeration__form-grid">
                <div class="input__title">
                    <h2>E-mail</h2>
                    {{ form.username }}
                </div>
                <div class="input__title">
                    <h2>Пароль</h2>
                    {{ form.password }}
                </div>
            </div>

            <button type="submit" class="btn registeration__btn-login _auth">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
