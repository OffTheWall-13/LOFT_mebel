<script>
document.addEventListener("DOMContentLoaded", function() {
    // Находим все сердечки
    document.querySelectorAll(".products__item-heart").forEach(function(heart) {
        heart.addEventListener("click", function(e) {
            e.preventDefault(); // отменяем переход по ссылке

            const url = heart.getAttribute("href");

            fetch(url, {
                method: "GET", // toggle_favorite у тебя GET
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            })
            .then(response => {
                if (response.ok) {
                    // переключаем класс сердечка
                    heart.classList.toggle("active");
                }
            })
            .catch(err => console.error("Ошибка избранного:", err));
        });
    });
});
</script>
